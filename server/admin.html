<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>4X PROTI · moderacija</title>
<style>
  :root { color-scheme: dark; --bg: #0d0d0d; --panel: #1a1a1a; --line: #2e2e2e; --text: #eee; --dim: #8a8a8a; --accent: #ff7f00; --bad: #ff4d6d; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 12px; } h1 span { color: var(--accent); }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
  input, select, button { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  input[type=search] { flex: 1 1 200px; }
  button { cursor: pointer; } button.save { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .4; cursor: default; }
  #status { color: var(--dim); } #status.err { color: var(--bad); }
  .wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 760px; }
  th, td { text-align: left; padding: 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--dim); font-weight: 500; font-size: 12px; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.meta { color: var(--dim); font-size: 12px; white-space: nowrap; }
  td input[type=text] { width: 100%; }
  tr.hidden td { opacity: .45; } tr.hidden td.actions, tr.hidden td.vis { opacity: 1; }
  tr.dirty td { background: #2a1e10; }
  .rowerr { color: var(--bad); font-size: 12px; }
  #login { max-width: 420px; display: flex; gap: 8px; } #login input { flex: 1; }
</style>
</head>
<body>
<h1><span>4X PROTI</span> · moderacija lestvice</h1>

<form id="login" hidden>
  <input id="token-in" type="password" placeholder="Žeton" autocomplete="off">
  <button>Vstopi</button>
</form>

<div id="app" hidden>
  <div class="bar">
    <input id="q" type="search" placeholder="Išči po vzdevku ali sporočilu">
    <select id="sort">
      <option value="recent">Najnovejši</option>
      <option value="top">Najboljši</option>
    </select>
    <button id="reload">Osveži</button>
    <span id="status"></span>
  </div>
  <div class="wrap">
    <table>
      <thead><tr><th>Točke</th><th>Vzdevek</th><th>Sporočilo</th><th>Čas / IP</th><th>Skrit</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

<script>
(function () {
  'use strict';
  var token = decodeURIComponent(location.hash.slice(1));
  var $ = function (id) { return document.getElementById(id); };

  function setStatus(text, err) { $('status').textContent = text || ''; $('status').className = err ? 'err' : ''; }

  async function api(path, opts) {
    var res = await fetch('api/admin' + path, Object.assign({}, opts, {
      headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }
    }));
    var body = null;
    try { body = await res.json(); } catch (e) {}
    if (res.status === 401) { showLogin(); throw new Error('Napačen žeton.'); }
    if (!res.ok) throw new Error((body && body.error) || 'HTTP ' + res.status);
    return body;
  }

  function showLogin() { $('app').hidden = true; $('login').hidden = false; $('token-in').focus(); }

  $('login').addEventListener('submit', function (e) {
    e.preventDefault();
    token = $('token-in').value.trim();
    history.replaceState(null, '', '#' + encodeURIComponent(token));
    start();
  });

  function cell(tr, content, cls) {
    var td = document.createElement('td');
    if (cls) td.className = cls;
    if (content instanceof Node) td.appendChild(content); else td.textContent = content;
    tr.appendChild(td);
    return td;
  }

  function input(value, max) {
    var el = document.createElement('input');
    el.type = 'text'; el.value = value; el.maxLength = max;
    return el;
  }

  function renderRow(row) {
    var tr = document.createElement('tr');
    var nick = input(row.nickname, 20), msg = input(row.message, 100);
    var hid = document.createElement('input'); hid.type = 'checkbox'; hid.checked = !!row.hidden;
    var save = document.createElement('button'); save.className = 'save'; save.textContent = 'Shrani'; save.disabled = true;
    var err = document.createElement('div'); err.className = 'rowerr';
    var meta = document.createElement('div');
    meta.textContent = new Date(row.createdAt).toLocaleString('sl-SI');
    var ip = document.createElement('div'); ip.textContent = row.ip; meta.appendChild(ip);

    cell(tr, row.score.toLocaleString('sl-SI'), 'num');
    cell(tr, nick);
    var msgTd = cell(tr, msg); msgTd.appendChild(err);
    cell(tr, meta, 'meta');
    cell(tr, hid, 'vis');
    cell(tr, save, 'actions');
    tr.classList.toggle('hidden', hid.checked);

    function dirty() {
      var d = nick.value !== row.nickname || msg.value !== row.message || hid.checked !== !!row.hidden;
      tr.classList.toggle('dirty', d); save.disabled = !d;
    }
    nick.addEventListener('input', dirty);
    msg.addEventListener('input', dirty);
    hid.addEventListener('change', dirty);
    [nick, msg].forEach(function (el) {
      el.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !save.disabled) save.click(); });
    });

    save.addEventListener('click', async function () {
      save.disabled = true; err.textContent = '';
      try {
        var updated = await api('/scores/' + encodeURIComponent(row.id), {
          method: 'PATCH',
          body: JSON.stringify({ nickname: nick.value, message: msg.value, hidden: hid.checked })
        });
        row.nickname = nick.value = updated.nickname;
        row.message = msg.value = updated.message;
        row.hidden = updated.hidden;
        tr.classList.toggle('hidden', !!row.hidden);
        dirty();
        setStatus('Shranjeno.');
      } catch (e) {
        err.textContent = e.message;
        dirty();
      }
    });
    return tr;
  }

  var loadSeq = 0;
  async function load() {
    var seq = ++loadSeq;
    setStatus('Nalaganje…');
    try {
      var rows = await api('/scores?sort=' + $('sort').value + '&q=' + encodeURIComponent($('q').value.trim()));
      if (seq !== loadSeq) return;
      var tbody = $('rows');
      tbody.textContent = '';
      rows.forEach(function (r) { tbody.appendChild(renderRow(r)); });
      setStatus(rows.length + (rows.length === 500 ? '+' : '') + ' vpisov');
    } catch (e) {
      if (seq === loadSeq) setStatus(e.message, true);
    }
  }

  function start() {
    $('login').hidden = true; $('app').hidden = false;
    load();
  }

  var t;
  $('q').addEventListener('input', function () { clearTimeout(t); t = setTimeout(load, 250); });
  $('sort').addEventListener('change', load);
  $('reload').addEventListener('click', load);

  if (token) start(); else showLogin();
})();
</script>
</body>
</html>
